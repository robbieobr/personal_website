# Compression is handled by Caddy in front of this container (see
# Caddyfile.example: `encode zstd gzip`), not here. Do NOT add `gzip on;` to
# this file: if nginx compressed a response first, Caddy would receive an
# already-encoded body and skip re-encoding it, which would silently
# preempt Caddy's better zstd encoding with nginx's gzip on every static
# asset. One compressor on the path, at the layer that can also compress
# the proxied /api JSON, is correct — leave this file's compression off.

# --- SEC-1: protect the backend's MySQL pool from being exhausted ---
# The pool is connectionLimit=10, queueLimit=0. getUserProfile() alone fires
# six Promise.all model queries that each hold a connection concurrently, so
# as few as ~2 simultaneous requests can saturate the whole pool (queueLimit
# 0 means excess requests fail immediately rather than queueing). There is
# no application-level rate limiting anywhere. The content behind /api/ is a
# read-only CV and the owner has confirmed the DB is restore-from-seed and
# never mutated in place, so caching every GET here is straightforwardly
# correct — there is no real staleness to worry about between deploys.
#
# proxy_cache_path and limit_req_zone must live in nginx's http{} context.
# This file is dropped in at /etc/nginx/conf.d/default.conf and pulled in
# via the base image's `include /etc/nginx/conf.d/*.conf;` inside its
# stock http{} block, so top-level directives placed here land there.
#
# NOTE: /var/cache/nginx must be writable for this. It is today (the
# `frontend` service in docker-compose.prod.yml does not set
# `read_only: true`). If read-only root filesystems are ever adopted for
# this container, add a `tmpfs: [/var/cache/nginx]` mount or nginx will
# fail to start (it errors at boot if it cannot create/write the cache path).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Backstop behind the cache, not the primary defence: legitimate traffic
# should mostly hit api_cache and never reach this limit.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# --- SEC-2: don't disclose the exact nginx version (helps fingerprint CVEs) ---
server_tokens off;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This container is only ever reached from the Caddy container on the
    # Docker network, so trust it as the one hop in front of us and read the
    # real client IP back out of X-Forwarded-For. Without this,
    # $remote_addr is always Caddy's container IP, and limit_req_zone above
    # would bucket every visitor on the internet into a single shared quota.
    #
    # Subnet confirmed via `docker network inspect
    # personal_website_personal_website_network` (172.18.0.0/16). It is a
    # plain `driver: bridge` network with no fixed subnet pinned in
    # docker-compose.yml, so Docker is free to assign a different one if the
    # network is ever torn down and recreated — re-verify if that happens.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache successful responses (this frontend only ever issues GETs
        # here; proxy_cache only caches GET/HEAD by default so a future POST
        # endpoint would not be accidentally cached).
        proxy_cache api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 5m;
        # The actual pool-exhaustion fix: on a cache miss, every concurrent
        # request for the same key queues behind ONE upstream request
        # instead of all of them hitting the backend (and its connection
        # pool) simultaneously.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_limit burst=20 nodelay;
    }

    # Hashed bundle output: Vite writes JS/CSS (and anything they import)
    # under /assets/ with a content hash in the filename, so it is safe to
    # cache forever — a new deploy produces new filenames, never the same
    # URL serving different content.
    #
    # `^~` short-circuits nginx's location matching so nothing under
    # /assets/ falls through to the extension-based regex block below —
    # this is the only Cache-Control an asset gets. Previously this same
    # path also matched a location using `expires 1y;` *and*
    # `add_header Cache-Control "public, immutable"`, which emits TWO
    # Cache-Control headers on one response (`expires` is shorthand for its
    # own Cache-Control write); fixed by keeping exactly one directive here.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed static files served as-is from /public (favicon, apple/PWA
    # icons, profile photo under /images/). These can change in place on a
    # redeploy without a new filename, so a week is a reasonable ceiling —
    # not the "immutable forever" treatment /assets/ gets above.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # robots.txt / sitemap.xml are produced by a separate change to this
    # branch; these blocks just make sure that once the files exist they are
    # served with the right content-type and a short cache (an edit goes
    # live within the hour), and — via the exact `=` match plus explicit
    # =404 — that a MISSING file 404s instead of silently falling through to
    # index.html the way it used to (see the SEO note on `location /` below).
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The served HTML is the one file that names the current hashed bundle
    # (e.g. /assets/index-<hash>.js). If a browser caches it, it can go on
    # requesting assets from a deploy that no longer exists. This response
    # previously sent NO Cache-Control at all, so browsers applied heuristic
    # freshness (~10% of Last-Modified age — roughly two weeks here) instead
    # of checking on every load. `no-cache` still lets the browser store a
    # copy, it just requires a cheap revalidation request before using it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SEO-1: this app ships with no client-side router, so every nonexistent
    # URL used to fall through to `/index.html` with a 200 — including
    # malformed paths, scanner/bot noise, and (worse) /robots.txt and
    # /sitemap.xml before they had real files backing them. A site that
    # returns 200 for everything is a soft-404 farm to search engines.
    #
    # Only restore the SPA fallback (`try_files $uri $uri/ /index.html;`) if
    # this app ever adds a client-side router that owns arbitrary paths.
    location / {
        try_files $uri $uri/ =404;
    }
}
