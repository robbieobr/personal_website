# Compression is handled by Caddy in front of this container (see
# Caddyfile.example). Do NOT add `gzip on;` here: if nginx compressed a
# response first, Caddy would receive an already-encoded body and skip
# re-encoding it, using nginx's gzip instead of Caddy's zstd.

# proxy_cache_path and limit_req_zone are http{}-context directives. This
# file is included from the base image's stock http{} block via
# /etc/nginx/conf.d/*.conf, so top-level directives placed here land there.
#
# /var/cache/nginx must be writable for the cache path below, or nginx
# fails to start. The `frontend` service in docker-compose.prod.yml does
# not set `read_only: true` today — if that changes, add a
# `tmpfs: [/var/cache/nginx]` mount.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Hides the nginx version from response headers.
server_tokens off;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Requests only ever arrive here via the Caddy container on the Docker
    # network, so the real client IP is read from X-Forwarded-For instead of
    # $remote_addr (which would otherwise always be Caddy's container IP).
    #
    # The 172.18.0.0/16 subnet is not pinned in docker-compose.yml, so
    # Docker may assign a different one if the network is ever recreated —
    # re-check this value if that happens.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # proxy_cache only caches GET/HEAD by default, so a future POST
        # endpoint would not be cached here.
        proxy_cache api_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 5m;
        # On a cache miss, concurrent requests for the same key queue behind
        # one upstream request instead of each hitting the backend directly.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_limit burst=20 nodelay;
    }

    # Vite writes JS/CSS under /assets/ with a content hash in the filename,
    # so these can be cached forever — a new deploy produces new filenames
    # rather than reusing an old one.
    #
    # `^~` short-circuits nginx's location matching so nothing under
    # /assets/ falls through to the extension-based block below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed static files served as-is from /public (favicon, PWA icons,
    # profile photo). These can change in place on a redeploy, so they get a
    # week of caching rather than the immutable treatment /assets/ gets above.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Serves with the correct content-type and a short cache, and returns a
    # real 404 (rather than falling through to index.html) if the file is
    # missing.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # index.html references the current hashed bundle filenames, so a stale
    # cached copy can point at assets from a deploy that no longer exists.
    # `no-cache` still lets the browser store a copy, but requires
    # revalidation before using it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # This app has no client-side router, so nonexistent paths 404 here
    # rather than falling through to index.html. Only restore the SPA
    # fallback (`try_files $uri $uri/ /index.html;`) if a client-side router
    # that owns arbitrary paths is added.
    location / {
        try_files $uri $uri/ =404;
    }
}
