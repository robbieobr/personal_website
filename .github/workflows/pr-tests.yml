name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  static-checks:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # One root lockfile covers the frontend/backend/e2e workspaces, so
      # `npm ci` runs once from the repo root rather than per-directory —
      # this is also what makes the two Dockerfiles' own `npm ci` resolve
      # the same tree CI just tested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck frontend
        run: npm run typecheck --workspace=frontend

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        run: npm run test:coverage --workspace=backend

      - name: Build backend
        run: npm run build --workspace=backend

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage --workspace=frontend

      - name: Build frontend
        run: npm run build --workspace=frontend

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Start Docker Compose stack
        run: docker compose up -d

      # One root lockfile covers frontend/backend/e2e — installing from the
      # repo root also satisfies the e2e workspace, no separate install step
      # needed inside ./e2e.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend to be ready
        # Docker startup order: MySQL healthcheck → backend → frontend.
        # Installing Playwright above gives the stack ~60 s head-start.
        # Poll until port 3000 responds (2 min hard timeout).
        run: |
          echo "Waiting for frontend on http://localhost:3000 ..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
          echo "Frontend is ready."

      - name: Run smoke tests
        working-directory: ./e2e
        run: npm test -- tests/smoke.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report/
          retention-days: 7
