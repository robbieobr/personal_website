name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

  seo-tests:
    name: SEO Tool Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install SEO tool dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement tools/seo/requirements.txt pytest

      - name: Run SEO tool tests
        run: python -m pytest tools/seo

  production-image:
    name: Production Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm install

      # The spec drives docker and never opens a page, so no browser is needed.
      - name: Build the production image and check the web root
        working-directory: ./e2e
        run: npx playwright test tests/docker-production-build.spec.ts

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend to be ready
        # Docker startup order: MySQL healthcheck → backend → frontend.
        # Installing Playwright above gives the stack ~60 s head-start.
        # Poll until port 3000 responds (2 min hard timeout).
        run: |
          echo "Waiting for frontend on http://localhost:3000 ..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
          echo "Frontend is ready."

      - name: Run smoke tests
        working-directory: ./e2e
        run: npm test -- tests/smoke.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report/
          retention-days: 7
